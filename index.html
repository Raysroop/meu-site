<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

<title>Death Note</title> <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,500&family=Shippori+Mincho:wght@500;800&display=swap');

:root{

--black:#0a0a0c;

--black-2:#131215;

--paper:#ede3c8;

--paper-dim:#ddd0ab;

--blood:#a61c1c;

--blood-bright:#d1372f;

--teal:#1f6f5c;

--teal-bright:#2f9c81;

--gold:#c9a227;

--ink:#1c1a16;

}

*{

box-sizing:border-box;

margin:0;

padding:0;

}

html,
body{

width:100%;

min-height:100%;

background:#0a0a0c;

color:var(--paper);

font-family:'EB Garamond',serif;

}

body{

min-height:100vh;

overflow-x:hidden;

}

.scene{

width:100%;

min-height:100vh;

display:none;

align-items:center;

justify-content:center;

flex-direction:column;

padding:6vh 6vw;

text-align:center;

}

.scene.active{

display:flex;

}

.display{

font-family:'Cinzel Decorative',serif;

font-weight:900;

line-height:1.1;

}

.eyebrow{

font-family:'Shippori Mincho',serif;

font-weight:800;

letter-spacing:0.35em;

text-transform:uppercase;

font-size:0.7rem;

color:var(--gold);

}

/* =========================================================
CAPA
========================================================= */

#scene-cover{

background:

radial-gradient(
  ellipse at 50% -10%,
  rgba(166,28,28,0.12),
  transparent 60%
),

radial-gradient(
  ellipse at 50% 110%,
  rgba(31,111,92,0.10),
  transparent 60%
),

#0a0a0c;

}

.notebook{

width:min(360px,78vw);

aspect-ratio:3/4.3;

background:

linear-gradient(
  160deg,
  #1a1414,
  #0f0c0c 60%
);

border:1px solid #2c2222;

border-radius:4px;

box-shadow:

0 40px 80px -20px rgba(0,0,0,0.8),

inset 0 0 60px rgba(166,28,28,0.06);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:1.2rem;

cursor:pointer;

transition:

transform 0.4s ease,

box-shadow 0.4s ease;

position:relative;

}

.notebook::before{

content:"";

position:absolute;

inset:14px;

border:1px solid rgba(166,28,28,0.35);

}

.notebook:hover{

transform:

translateY(-4px)
scale(1.01);

box-shadow:

0 50px 90px -20px rgba(166,28,28,0.25),

inset 0 0 60px rgba(166,28,28,0.1);

}

.notebook .title{

font-size:clamp(2rem,6vw,2.6rem);

color:var(--blood-bright);

letter-spacing:0.06em;

}

.notebook .sub{

font-family:'Shippori Mincho',serif;

color:var(--paper-dim);

font-size:0.95rem;

letter-spacing:0.08em;

line-height:1.6;

max-width:280px;

}

.music-label{

margin-top:0.4rem;

color:var(--gold);

font-family:'EB Garamond',serif;

font-style:italic;

font-size:0.9rem;

line-height:1.4;

max-width:290px;

}

/* =========================================================
REGRAS
========================================================= */

#scene-rules{

background:

radial-gradient(
  ellipse at 50% -10%,
  rgba(166,28,28,0.12),
  transparent 60%
),

#0a0a0c;

}

.rules-card{

max-width:560px;

background:var(--paper);

color:var(--ink);

border-radius:2px;

padding:2.6rem 2.2rem;

box-shadow:

0 30px 70px -25px rgba(0,0,0,0.7);

text-align:left;

}

.rules-card h2{

font-family:'Cinzel Decorative',serif;

color:var(--blood);

font-size:1.5rem;

margin-bottom:0.3rem;

}

.rules-card .eyebrow{

color:var(--blood);

}

.rules-list{

margin-top:1.4rem;

list-style:none;

display:flex;

flex-direction:column;

gap:0.9rem;

font-size:1.05rem;

counter-reset:rule;

}

.rules-list li{

padding-left:2rem;

position:relative;

line-height:1.5;

}

.rules-list li::before{

content:counter(rule);

counter-increment:rule;

position:absolute;

left:0;

top:0;

font-family:'Cinzel Decorative';

font-weight:900;

color:var(--blood);

}

.page-turn{

margin-top:2rem;

cursor:pointer;

color:var(--gold);

letter-spacing:0.2em;

text-transform:uppercase;

font-size:0.75rem;

animation:pulse 1.8s infinite ease-in-out;

}

@keyframes pulse{

50%{

opacity:0.35;

}

}

/* =========================================================
QUIZ
========================================================= */

#scene-quiz{

background:

radial-gradient(
  ellipse at 50% -10%,
  rgba(31,111,92,0.08),
  transparent 60%
),

#0a0a0c;

}

.quiz-card{

max-width:560px;

width:100%;

}

.progress-wrap{

width:100%;

max-width:420px;

height:10px;

background:#1e1e22;

border-radius:6px;

overflow:hidden;

margin:1.6rem auto 2.2rem;

border:1px solid #2c2c31;

}

.progress-bar{

height:100%;

width:0%;

background:

linear-gradient(
  90deg,
  var(--teal),
  var(--gold)
);

transition:width 0.6s ease;

box-shadow:

0 0 14px var(--teal-bright);

}

.q-eyebrow{

color:var(--teal-bright);

}

.question{

font-size:clamp(1.2rem,3.2vw,1.6rem);

margin:0.6rem 0 1.8rem;

color:var(--paper);

}

.options{

display:flex;

flex-direction:column;

gap:0.8rem;

width:100%;

max-width:420px;

}

.opt{

background:var(--black-2);

border:1px solid #2c2c31;

color:var(--paper);

font-family:'EB Garamond',serif;

font-size:1.05rem;

padding:0.85rem 1.2rem;

border-radius:6px;

cursor:pointer;

transition:all 0.25s ease;

text-align:left;

}

.opt:hover{

border-color:var(--teal-bright);

background:#171a19;

transform:translateX(4px);

}

.opt.correct{

border-color:var(--teal-bright);

background:#123028;

color:var(--teal-bright);

}

.opt.wrong{

border-color:var(--blood-bright);

background:#2a1414;

color:var(--blood-bright);

animation:shake 0.35s ease;

}

@keyframes shake{

25%{

transform:translateX(-5px);

}

75%{

transform:translateX(5px);

}

}

.feedback{

margin-top:1.6rem;

min-height:2.8rem;

font-family:'Shippori Mincho',serif;

font-size:0.95rem;

color:var(--gold);

line-height:1.5;

}

.feedback.yellow{

color:#ffd84a;

text-shadow:

0 0 8px rgba(255,216,74,0.15);

}

/* =========================================================
INICIAR DESAFIO
========================================================= */

#scene-start{

background:#0a0a0c;

}

.start-challenge{

max-width:650px;

width:100%;

}

.start-eyebrow{

color:var(--blood-bright);

margin-bottom:1rem;

}

.start-title{

font-size:clamp(2rem,7vw,3.5rem);

color:var(--paper);

margin-bottom:1.2rem;

}

.start-sub{

color:var(--paper-dim);

font-size:1.1rem;

line-height:1.6;

max-width:500px;

margin:0 auto 2.5rem;

}

.start-button{

padding:1rem 2.8rem;

border:none;

border-radius:7px;

background:

linear-gradient(
  135deg,
  var(--teal-bright),
  var(--teal)
);

color:#0a0a0c;

font-family:'Shippori Mincho',serif;

font-weight:800;

letter-spacing:0.08em;

font-size:1rem;

cursor:pointer;

box-shadow:

0 10px 30px -8px rgba(47,156,129,0.6);

transition:

transform 0.2s ease,

box-shadow 0.2s ease;

}

.start-button:hover{

transform:

translateY(-3px)
scale(1.03);

box-shadow:

0 15px 35px -8px rgba(47,156,129,0.7);

}

/* =========================================================
TELA PRETA
========================================================= */

#scene-black{

background:#000;

padding:0;

}

</style> </head> <body> <!-- ========================================================= MUSICA ========================================================= -->

</audio> <!-- ========================================================= CAPA ========================================================= --> <section class="scene active" id="scene-cover" > <div class="notebook" onclick="openNotebook()" >

</button> </section> <!-- ========================================================= TELA PRETA ========================================================= --> <section class="scene" id="scene-black" ></section> <script>
/* =========================================================
MUSICA
========================================================= */

const themeMusic =
document.getElementById('themeMusic');

function playTheme(){

if(!themeMusic){

return;

}

themeMusic.volume = 0.55;

const promise =
themeMusic.play();

if(promise !== undefined){

promise.catch(
  function(){

    /*
      Alguns navegadores bloqueiam
      autoplay de áudio.

      Nesse caso, o primeiro clique
      do usuário inicia a música.
    */

  }
);

}

}

/*
Tenta iniciar automaticamente
quando a página carregar.
*/

window.addEventListener(
'load',
function(){

playTheme();

}
);

/*
Se o navegador bloquear o autoplay,
qualquer interação inicia a música.
*/

document.addEventListener(
'click',
function(){

if(themeMusic.paused){

  playTheme();

}

}
);

document.addEventListener(
'touchstart',
function(){

if(themeMusic.paused){

  playTheme();

}

},
{passive:true}
);

document.addEventListener(
'keydown',
function(){

if(themeMusic.paused){

  playTheme();

}

}
);

/* =========================================================
QUIZ
========================================================= */

const quizData = [

{

eyebrow:

  "Desafio 1 de 3 — Respiração da Memória",

question:

  "Como o Felipe e a Rafaella se conheceram?",

options:[

  "Ela respondeu um story dele elogiando a roupa",

  "Eles se esbarraram numa convenção de anime",

  "Foi um match de aplicativo de namoro"

],

correct:0,

feedback:

  "Certo. Ela mandou \"melhor que os chungas\" e o Felipe, com toda elegância, achou que era outra pessoa respondendo.",

wrongFeedbacks:{

  1:

    "Alem de burra<br>é mentirosa.",

  2:

    "Senhor. Tem momentos que sua burrice ultrapassa o meu esperado"

}

},

{

eyebrow:

  "Desafio 2 de 3 — Julgamento do Caderno",

question:

  "Qual é o apelido oficial e definitivo da Rafaella?",

options:[

  "Muichiro Tokito",

  "Lerdona",

  "L"

],

correct:1,

feedback:

  "Óbvio. Título conquistado com muito mérito e nenhuma pressa.",

wrongFeedbacks:{

  0:

    "Jurou demais né querida.",

  2:

    "Taquiopariu, jura mais."

}

},

{

eyebrow:

  "Desafio 3 de 3 — Escolha do Nome no Caderno",

question:

  "Qual é o anime favorito dos dois?",

options:[

  "Attack on Titan",

  "Naruto",

  "Death Note"

],

correct:2,

feedback:

  "Isso mesmo — com Demon Slayer logo atrás, sempre no pódio.",

wrongFeedbacks:{

  0:

    "De gigante já basta o meu.",

  1:

    "Não tenho trocadilho pra isso então sei la."

}

}

];

let qIndex = 0;

/* =========================================================
NAVEGAÇÃO
========================================================= */

function goTo(id){

document
.querySelectorAll('.scene')
.forEach(
function(scene){

    scene.classList.remove('active');

  }
);

const target =
document.getElementById(
'scene-' + id
);

if(!target){

return;

}

target.classList.add('active');

if(id === 'quiz'){

qIndex = 0;

renderQuestion();

}

}

/* =========================================================
ABRIR CADERNO
========================================================= */

function openNotebook(){

playTheme();

goTo('rules');

}

/* =========================================================
RENDERIZAR PERGUNTA
========================================================= */

function renderQuestion(){

const data =
quizData[qIndex];

document
.getElementById('quiz-eyebrow')
.textContent =
data.eyebrow;

document
.getElementById('quiz-question')
.textContent =
data.question;

document
.getElementById('progress')
.style.width =
(
qIndex /
quizData.length *
100
) + '%';

const feedback =
document.getElementById(
'quiz-feedback'
);

feedback.innerHTML = '';

feedback.classList.remove('yellow');

const optsWrap =
document.getElementById(
'quiz-options'
);

optsWrap.innerHTML = '';

data.options.forEach(
function(opt,i){

  const btn =
    document.createElement(
      'button'
    );

  btn.className =
    'opt';

  btn.textContent =
    opt;

  btn.onclick =
    function(){

      selectAnswer(
        i,
        btn
      );

    };

  optsWrap.appendChild(
    btn
  );

}

);

}

/* =========================================================
RESPOSTA
========================================================= */

function selectAnswer(
i,
btnEl
){

const data =
quizData[qIndex];

const feedback =
document.getElementById(
'quiz-feedback'
);

/* RESPOSTA ERRADA */

if(i !== data.correct){

btnEl.classList.add('wrong');

btnEl.style.pointerEvents =
  'none';

if(
  data.wrongFeedbacks &&
  data.wrongFeedbacks[i]
){

  feedback.innerHTML =
    data.wrongFeedbacks[i];

  if(
    qIndex === 0 ||
    qIndex === 2
  ){

    feedback.classList.add(
      'yellow'
    );

  }

}else{

  feedback.textContent =
    "Errou. Que surpresa. Tenta de novo, lerdona.";

}

return;

}

/* RESPOSTA CERTA */

document
.querySelectorAll('.opt')
.forEach(
function(button){

    button.style.pointerEvents =
      'none';

  }
);

btnEl.classList.add('correct');

feedback.classList.remove('yellow');

feedback.textContent =
data.feedback;

document
.getElementById('progress')
.style.width =
(
(qIndex + 1) /
quizData.length *
100
) + '%';

setTimeout(
function(){

  qIndex++;

  if(
    qIndex <
    quizData.length
  ){

    renderQuestion();

  }else{

    /*
      Quiz terminado.

      Vai para a tela:

      "Pronto para iniciar o desafio?"
    */

    goTo('start');

  }

},
1400

);

}

/* =========================================================
INICIAR DESAFIO
========================================================= */

function startChallenge(){

/*
Agora usamos exatamente o mesmo
sistema de navegação das outras telas.

Isso evita que a página inteira
fique preta antes da hora.

*/

goTo('black');

}

</script> </body> </html>
