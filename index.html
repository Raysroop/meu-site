
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cronómetro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .circulo {
            width: 280px;
            height: 280px;

            border: 8px solid #00ff66;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: opacity 0.5s ease;
        }

        .tempo {
            color: white;
            font-size: 80px;
            font-weight: bold;
        }

        .escondido {
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="circulo" id="circulo">
        <div class="tempo" id="tempo">10</div>
    </div>

    <script>
        let tempo = 10;

        const numero = document.getElementById("tempo");
        const circulo = document.getElementById("circulo");

        const cronometro = setInterval(() => {
            tempo--;

            numero.textContent = tempo;

            if (tempo <= 0) {
                clearInterval(cronometro);

                circulo.classList.add("escondido");
            }
        }, 1000);
    </script>

</body>
</html>
